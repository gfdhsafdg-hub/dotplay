name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "Dots Game" com.hooshsakhteh.dots --web-dir=www
          npx cap add android
          npx cap sync android
          sed -i 's/Dots Game/نقطه‌بازی/g' android/app/src/main/res/values/strings.xml
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Apply app icon
        continue-on-error: true
        run: |
          if [ -f icon.png ]; then
            pip install pillow
            python3 - <<'PY'
import os
from PIL import Image
src = Image.open('icon.png').convert('RGBA')
res = 'android/app/src/main/res'
dens = {'mdpi': (48, 108), 'hdpi': (72, 162), 'xhdpi': (96, 216), 'xxhdpi': (144, 324), 'xxxhdpi': (192, 432)}
for d, (s, _) in dens.items():
    img = src.resize((s, s), Image.LANCZOS)
    path = f'{res}/mipmap-{d}'
    os.makedirs(path, exist_ok=True)
    img.save(f'{path}/ic_launcher.png')
    img.save(f'{path}/ic_launcher_round.png')
print("Icons applied successfully!")
PY
          fi

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DotsGame-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk